[project]
name = "autocog"
version = "0.0.1"
description = "Automated psychologist: adversarial theory-debate framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "pandas",
    "numpy",
    "scipy",
    "google-genai",
    "websockets>=13,<17",
    "python-dotenv",
    "auto-prompt @ git+https://github.com/younesStrittmatter/auto-prompt.git@main",
    "sweetbean @ git+https://github.com/AutoResearch/sweetbean.git@main",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Ship both the main `autocog` package and top-level `domains` so
# `from domains...` works after `pip install -e .` (no sys.path hacks).
include = ["autocog*", "domains*"]

[dependency-groups]
dev = ["cookiecutter", "pytest>=8.0"]
