domain: category_learning
seed_theories:
  - gcm.yaml
  - rulex.yaml

llm:
  provider: gemini
  model: gemini-3.1-pro-preview
  temperature: 0.7
  max_tokens: 32768
  thinking_budget: 8096

n_rounds: 5
seed: 42
max_verify_retries: 5
max_gecco_retries: 3
disabled_stages: []
run_tag: default
diversity_requirement: >
  Each round, your proposed structure must target a theoretical distinction not
  yet covered by prior proposals.
