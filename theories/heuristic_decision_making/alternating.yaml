name: "Alternation (win-stay-lose-shift's degenerate cousin: pure switch)"
theory: |
  People ignore the stimulus entirely and simply alternate their response from trial to trial. The very first choice has no prior to switch from, so it is made at random (a coin flip over the two options). On every subsequent trial the response is the opposite of the previous response: if the last choice was option A the next is option B, and vice versa. This is a pure perseveration-free switching strategy — a sequential-dependency baseline that depends only on the choice history, not on any feature ratings or validities. It captures a subject who has decided to "take turns" between the options regardless of evidence.
predict: |
  def predict(parameters, stimulus, history):
      # Pure alternation, independent of the stimulus. The first choice is a
      # coin flip (uniform probabilities, realized by the sampling policy);
      # every later choice is the opposite of the previous *realized*
      # response, read from the trial history. The stimulus is ignored.
      stim = np.asarray(stimulus)
      n_opts = stim.shape[0] if stim.ndim >= 1 and stim.shape[0] >= 2 else 2

      responses = []
      if isinstance(history, dict):
          responses = history.get("response", []) or []

      if len(responses) == 0:
          # First trial: no prior choice to switch from -> random pick.
          return np.ones(n_opts) / n_opts

      # Switch away from the last realized choice. For the binary task this
      # is simply 1 - last; the modulo generalizes to >2 options.
      last = int(responses[-1])
      nxt = (last + 1) % n_opts
      out = np.zeros(n_opts)
      out[nxt] = 1.0
      return out
policy: |
  def policy(probabilities):
      probabilities = probabilities / probabilities.sum()  # Ensure valid probabilities.
      return np.random.choice(len(probabilities), p=probabilities)
parameters: {}
