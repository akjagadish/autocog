name: "Take The Worst (one-reason, LEAST-valid cue; inverted Gigerenzer & Goldstein 1996)"
theory: |
  People compare two options by consulting cues one at a time, but in the WRONG order — from least valid to most valid — stopping at the first cue that discriminates between the two options. That cue alone determines the choice: the option with the higher value on the first discriminating (and least-valid available) cue wins, and no further cue is consulted. This is the adversarial inverse of Take The Best: it keeps TTB's one-reason, lexicographic, maximally frugal character but follows an ASCENDING-validity cue cascade rather than a descending one. The result is a model that is perfectly predictive of choices yet leans almost entirely on the cues an analyst would normally treat as noise — the low-validity features the design does NOT bias toward. When two options agree on the least-valid cue the cascade climbs to the next-least-valid cue, and so on; only when every cue ties does the learner have no basis for preference and must guess. Response noise enters through a softmax over the binary score (winner = 1, loser = 0) with inverse temperature beta, plus an independent lapse that with probability epsilon replaces the softmax output with a uniform pick over the two options.
predict: |
  def predict(parameters, stimulus, history):
      # Take The Worst: TTB's cue cascade run in ASCENDING validity order.
      # Stimulus is the pair of option feature vectors for the current
      # trial: array-like of shape (2, n_features), row 0 = option A,
      # row 1 = option B. The first discriminating cue (strict inequality),
      # scanned from least- to most-valid, determines the winner; if no cue
      # discriminates the model guesses uniformly. History is ignored.
      stim = np.asarray(stimulus, dtype=float)
      if stim.ndim != 2 or stim.shape[0] != 2:
          raise ValueError(
              f"Take The Worst expects a (2, n_features) stimulus; got shape {stim.shape}."
          )
      n_features = stim.shape[1]

      val = np.asarray(parameters["validities"], dtype=float)
      if val.shape[0] != n_features:
          raise ValueError(
              f"validities length {val.shape[0]} != n_features {n_features}."
          )
      # Ascending validity (least valid first); argsort is stable so validity
      # ties break toward the earlier feature index.
      cue_order = np.argsort(val, kind="stable").tolist()

      a, b = stim[0], stim[1]
      winner = None
      for j in cue_order:
          if a[j] > b[j]:
              winner = 0
              break
          if b[j] > a[j]:
              winner = 1
              break

      if winner is None:
          # No discriminating cue — pure guess.
          return np.ones(2) / 2.0

      scores = np.array([1.0, 0.0]) if winner == 0 else np.array([0.0, 1.0])

      beta = float(parameters["beta"])
      epsilon = float(parameters["epsilon"])

      # Softmax with max-subtraction for numerical stability. For the binary
      # score this collapses to sigmoid(beta) for the winner (beta=0 ↔ 50/50;
      # beta ≫ 1 ↔ deterministic).
      z = beta * (scores - scores.max())
      e = np.exp(z)
      p_core = e / e.sum()

      n_opts = p_core.shape[0]
      return (1.0 - epsilon) * p_core + epsilon * (np.ones(n_opts) / n_opts)
policy: |
  def policy(probabilities):
      probabilities = probabilities / probabilities.sum()  # Ensure valid probabilities.
      return np.random.choice(len(probabilities), p=probabilities)
parameters:
  # Beta ranges cover near-random (0.1) to near-deterministic (20.0);
  # epsilon's upper bound of 0.5 is the maximum-noise (uniform-guess)
  # condition. Validities set the cue cascade: unlike TTB the cascade is the
  # ASCENDING sort of this vector, so the least-valid cue is consulted first.
  beta: "[0.1, 20.0]"
  epsilon: "[0.0, 0.5]"
  validities: "validities"  # Vector of length n_features; cue cascade is the ASCENDING sort.
