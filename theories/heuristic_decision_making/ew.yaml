name: "Equal-Weight Heuristic (Dawes 1979; Gigerenzer & Gaissmaier 2011)"
theory: |
  People compare two options by summing each option's feature values with equal weight, then choose the option with the higher unweighted sum. No feature is privileged: every cue contributes with weight 1, and inter-cue validity differences are ignored. The heuristic uses cardinal feature magnitudes rather than just their signs, so a large difference on a single feature can dominate many small differences on the others. Choice is monotone in the two sums: the option with the larger sum is preferred, and behavior is invariant to any shared additive or multiplicative rescaling across options. When the two sums are equal the heuristic has no basis for preference and the learner must guess. Response noise enters through a softmax over the two sums with inverse temperature beta (interpolating between fully deterministic choice at large beta and uniform guessing at beta = 0), plus an independent lapse that with probability epsilon replaces the softmax output with a uniform pick over the two options.
predict: |
  def predict(parameters, stimulus, history):
      # Paper-faithful Equal-Weight heuristic (Dawes 1979; reviewed in
      # Gigerenzer & Gaissmaier 2011). Stimulus is the pair of option
      # feature vectors for the current trial: array-like of shape
      # (2, n_features), with row 0 = option A, row 1 = option B.
      # History is ignored: heuristic choice depends only on the
      # current stimulus.
      stim = np.asarray(stimulus, dtype=float)
      if stim.ndim != 2 or stim.shape[0] != 2:
          raise ValueError(
              f"EW expects a (2, n_features) stimulus; got shape {stim.shape}."
          )

      # Equal-weight sum per option; mean would give the identical argmax
      # but sum matches the standard EW formulation.
      scores = stim.sum(axis=1)

      beta = float(parameters["beta"])
      epsilon = float(parameters["epsilon"])

      # Softmax with max-subtraction for numerical stability.
      z = beta * (scores - scores.max())
      e = np.exp(z)
      p_core = e / e.sum()

      # Uniform lapse blended into the softmax (standard choice-with-lapse
      # formulation; at epsilon=0.5 the two options are equiprobable,
      # matching the paper's maximum noise level).
      n_opts = p_core.shape[0]
      return (1.0 - epsilon) * p_core + epsilon * (np.ones(n_opts) / n_opts)
policy: |
  def policy(probabilities):
      return int(np.argmax(probabilities))
parameters:
  # Beta ranges cover near-random (0.1) to near-deterministic (20.0).
  # Epsilon's upper bound of 0.5 reproduces the paper's maximum-noise
  # condition (choice becomes equivalent to random guessing).
  beta: "[0.1, 20.0]"
  epsilon: "[0.0, 0.5]"
