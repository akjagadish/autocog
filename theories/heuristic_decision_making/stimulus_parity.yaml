name: "Stimulus Parity"
theory: |
  People choose based on the parity of the total feature-bit sum across the two
  options: they add up every feature value of option A and every feature value
  of option B, and if that grand total is even they pick option A, otherwise
  they pick option B.
predict: |
  def predict(parameters, stimulus, history):
      # Stimulus is the pair of option feature
      # vectors for the current trial: array-like of shape (2, n_features),
      # row 0 = option A, row 1 = option B. The winner is A when the total
      # of every feature value across BOTH options is even, else B. 
      stim = np.asarray(stimulus, dtype=float)
      if stim.ndim != 2 or stim.shape[0] != 2:
          raise ValueError(
              f"stimulus_parity expects a (2, n_features) stimulus; "
              f"got shape {stim.shape}."
          )

      # Round before the modulo so float dust on integer-valued binary
      # features can never flip the parity.
      total = int(round(float(stim.sum())))
      winner = 0 if total % 2 == 0 else 1
      scores = np.array([1.0, 0.0]) if winner == 0 else np.array([0.0, 1.0])

      beta = float(parameters["beta"])
      epsilon = float(parameters["epsilon"])

      # Standard softmax + uniform lapse noise channel
      z = beta * (scores - scores.max())
      e = np.exp(z)
      p_core = e / e.sum()

      n_opts = p_core.shape[0]
      return (1.0 - epsilon) * p_core + epsilon * (np.ones(n_opts) / n_opts)
policy: |
  def policy(probabilities):
      probabilities = probabilities / probabilities.sum()  # Ensure valid probabilities.
      return np.random.choice(len(probabilities), p=probabilities)
parameters:
  # Beta ranges from near-random (0.1) to near-deterministic (20.0); epsilon's
  # upper bound of 0.5 gives equiprobable options at maximum lapse.
  beta: "[0.1, 20.0]"
  epsilon: "[0.0, 0.5]"
