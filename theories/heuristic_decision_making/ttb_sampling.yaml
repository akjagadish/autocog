name: "Take The Best (Gigerenzer & Goldstein 1996)"
theory: |
  People compare two options by consulting cues one at a time in order of validity, stopping at the first cue that discriminates between the two options. That cue alone determines the choice: the option with the higher value on the discriminating cue wins, and no other cue is consulted. Cues with lower validity are never reached when a higher-validity cue already discriminates, so Take The Best is a "one-reason" decision rule — only a single feature is ever used on any given choice. Because only the sign of the comparison on the top discriminating cue matters, TTB ignores both the magnitude of that difference and all information on lower-validity cues, making it maximally frugal in the use of evidence. Cue validities are subjective and can be learned, inferred from instructions, or fixed by task structure. When no cue discriminates (all feature-wise comparisons tie) the learner has no basis for preference and must guess. Response noise enters through a softmax over the binary TTB score (winner = 1, loser = 0) with inverse temperature beta, plus an independent lapse that with probability epsilon replaces the softmax output with a uniform pick over the two options.
predict: |
  def predict(parameters, stimulus, history):
      # Paper-faithful Take The Best (Gigerenzer & Goldstein 1996).
      # Stimulus is the pair of option feature vectors for the current
      # trial: array-like of shape (2, n_features), row 0 = option A,
      # row 1 = option B. Cue cascade: features are consulted in order
      # of descending validity; the first discriminating cue (strict
      # inequality) determines the winner; if no cue discriminates,
      # the model guesses uniformly. History is ignored.
      stim = np.asarray(stimulus, dtype=float)
      if stim.ndim != 2 or stim.shape[0] != 2:
          raise ValueError(
              f"TTB expects a (2, n_features) stimulus; got shape {stim.shape}."
          )
      n_features = stim.shape[1]

      val = np.asarray(parameters["validities"], dtype=float)
      if val.shape[0] != n_features:
          raise ValueError(
              f"validities length {val.shape[0]} != n_features {n_features}."
          )
      # Descending validity; argsort is stable so validity ties break
      # toward the earlier feature index.
      cue_order = np.argsort(-val, kind="stable").tolist()

      a, b = stim[0], stim[1]
      winner = None
      for j in cue_order:
          if a[j] > b[j]:
              winner = 0
              break
          if b[j] > a[j]:
              winner = 1
              break

      if winner is None:
          # No discriminating cue — pure guess.
          return np.ones(2) / 2.0

      scores = np.array([1.0, 0.0]) if winner == 0 else np.array([0.0, 1.0])

      beta = float(parameters["beta"])
      epsilon = float(parameters["epsilon"])

      # Softmax with max-subtraction for numerical stability. For the
      # binary TTB score this collapses to sigmoid(beta) for the winner,
      # giving a direct mapping from beta onto the paper's flip-noise
      # levels (beta=0 ↔ 50/50; beta ≫ 1 ↔ deterministic).
      z = beta * (scores - scores.max())
      e = np.exp(z)
      p_core = e / e.sum()

      n_opts = p_core.shape[0]
      return (1.0 - epsilon) * p_core + epsilon * (np.ones(n_opts) / n_opts)
policy: |
  def policy(probabilities):
      probabilities = probabilities / probabilities.sum()  # Ensure valid probabilities.
      return np.random.choice(len(probabilities), p=probabilities)
parameters:
  # Beta ranges cover near-random (0.1) to near-deterministic (20.0);
  # epsilon's upper bound of 0.5 reproduces the paper's maximum-noise
  # condition. Validities are subjective per-feature cue weights: the
  # cue cascade is determined by the descending sort of this vector,
  # so the configuration {0.3, 0.9, 0.3} (for a 3-feature task)
  # reproduces the paper's "prioritize the second feature" setup, and
  # any strictly descending vector recovers the classical
  # Gigerenzer–Goldstein (1996) ordering.
  beta: "[0.1, 20.0]"
  epsilon: "[0.0, 0.5]"
  validities: "validities"  # Vector of length n_features; cue cascade determined by descending sort.
