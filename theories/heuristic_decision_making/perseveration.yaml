name: "Perseveration (win-stay-lose-stay's degenerate cousin: pure repeat)"
theory: |
  People ignore the stimulus entirely and simply repeat their previous response from trial to trial. The very first choice has no prior to repeat, so it is made at random (a coin flip over the two options). On every subsequent trial the response is identical to the previous response: if the last choice was option A the next is again A, and if it was B the next is again B. This is a pure perseveration strategy — a sequential-dependency baseline that depends only on the choice history, not on any feature ratings or validities. It is the exact mirror image of the alternation baseline: where alternation flips the previous choice, perseveration keeps it, so the two are distinguished purely by the SIGN of their lag-1 sequential dependency (perseveration's is +1, alternation's is -1). It captures a subject who has "locked in" on whichever option they happened to start with.
predict: |
  def predict(parameters, stimulus, history):
      # Pure perseveration, independent of the stimulus. The first choice is a
      # coin flip (uniform probabilities, realized by the sampling policy);
      # every later choice repeats the previous *realized* response, read from
      # the trial history. The stimulus is ignored.
      stim = np.asarray(stimulus)
      n_opts = stim.shape[0] if stim.ndim >= 1 and stim.shape[0] >= 2 else 2

      responses = []
      if isinstance(history, dict):
          responses = history.get("response", []) or []

      if len(responses) == 0:
          # First trial: no prior choice to repeat -> random pick.
          return np.ones(n_opts) / n_opts

      # Repeat the last realized choice deterministically.
      last = int(responses[-1])
      out = np.zeros(n_opts)
      out[last] = 1.0
      return out
policy: |
  def policy(probabilities):
      probabilities = probabilities / probabilities.sum()  # Ensure valid probabilities.
      return np.random.choice(len(probabilities), p=probabilities)
